name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a run on main midway: it may be deploying.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Deploy targets. Override with repository variables (Settings > Secrets and
# variables > Actions > Variables) if the Space or URLs change.
env:
  HF_SPACE: ${{ vars.HF_SPACE || 'arora2006/voicemarkers-api' }}
  API_BASE_URL: ${{ vars.API_BASE_URL || 'https://arora2006-voicemarkers-api.hf.space' }}
  # The frontend is deployed by Vercel's GitHub integration (project "voice-markers");
  # this origin is the only website the API accepts browser requests from (CORS).
  FRONTEND_URL: ${{ vars.FRONTEND_URL || 'https://voice-markers.vercel.app' }}

jobs:
  python:
    name: Python (lint + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            research/requirements.txt
      - name: Install ffmpeg (decodes browser WebM/MP4 uploads, as in production)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install
        run: pip install -e "backend[dev]" -r research/requirements.txt
      - name: Ruff
        run: ruff check .
      - name: Black
        run: black --check .
      - name: Pytest
        run: pytest -q

  frontend:
    name: Frontend (format + typecheck + tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Prettier
        run: npm run format:check
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build

  docker:
    name: Docker image (build + smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the production image
        run: docker build -t voicemarkers-api backend
      - name: Start it
        run: docker run -d --name api -p 7860:7860 -e BUILD_SHA=ci voicemarkers-api
      - name: Wait for /health (model loaded)
        run: |
          for i in $(seq 1 60); do
            if curl -fsS localhost:7860/health | grep -q '"model_loaded":true'; then exit 0; fi
            sleep 2
          done
          echo "API did not become healthy"; exit 1
      - name: Predict from the sample WAV
        run: |
          curl -fsS -X POST --data-binary @data/samples/synthetic_steady.wav \
            -H "Content-Type: audio/wav" localhost:7860/predict/audio > out.json
          python3 -c "import json; d = json.load(open('out.json')); assert d['prediction']['label'] in {'healthy_like', 'parkinsons_like'}; assert d['disclaimer']; print(d['prediction'])"
      - name: Predict from browser-style WebM (ffmpeg inside the image)
        run: |
          docker exec api ffmpeg -loglevel error -f lavfi -i "sine=frequency=150:duration=3" \
            -c:a libopus -f webm - > tone.webm
          code=$(curl -s -o webm.json -w "%{http_code}" -X POST --data-binary @tone.webm \
            -H "Content-Type: audio/webm" localhost:7860/predict/audio)
          cat webm.json; echo
          # A pure tone decodes fine but is not a voice: 200 or a 422 voice-check error,
          # never 415 (format unsupported) or 400 (undecodable).
          [ "$code" = "200" ] || [ "$code" = "422" ]
      - name: Runs as a non-root user
        run: '[ "$(docker exec api id -u)" = "1000" ]'
      - name: Container logs
        if: always()
        run: docker logs api

  deploy-backend:
    name: Deploy backend (Hugging Face Space)
    needs: [python, frontend, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-backend
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - name: Check for the HF_TOKEN secret
        id: check
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -n "$HF_TOKEN" ]; then echo "enabled=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::HF_TOKEN secret not set; skipping backend deploy (see docs/deployment.md)"; fi
      - uses: actions/setup-python@v7
        if: steps.check.outputs.enabled == 'true'
        with:
          python-version: "3.11"
      - name: Upload to the Space
        if: steps.check.outputs.enabled == 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          pip install "huggingface_hub==2.4.0"
          python -m deploy.deploy_space --repo-id "$HF_SPACE" --build-sha "$GITHUB_SHA" \
            --cors-origins "$FRONTEND_URL"
      - name: Wait until the new build is live
        if: steps.check.outputs.enabled == 'true'
        # The Space rebuilds its image after each upload (several minutes). Fails fast,
        # with Hugging Face's message, if the build errors or the Space stays paused.
        run: |
          python -m deploy.wait_for_space --repo-id "$HF_SPACE" --api-url "$API_BASE_URL" \
            --build-sha "$GITHUB_SHA" --timeout-minutes 30
