# Install once: pip install pre-commit && pre-commit install
# Run on everything: pre-commit run --all-files
# The original research notebook is kept byte-for-byte as it was written.
exclude: ^research/original/
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=1000"]
      - id: detect-private-key

  # Ruff for linting only; black does the formatting.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.6
    hooks:
      - id: ruff-check
        args: ["--fix"]
        types: [python]

  - repo: https://github.com/psf/black-pre-commit-mirror
    rev: 26.10.1
    hooks:
      - id: black

  # Uses the frontend's own prettier install, so the version matches CI.
  # Requires `npm install` in frontend/ first.
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: bash -c 'cd frontend && npx --no-install prettier --write --ignore-unknown "${@#frontend/}"' --
        language: system
        files: ^frontend/
