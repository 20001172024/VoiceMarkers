[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voicemarkers-backend"
version = "0.1.0"
description = "VoiceMarkers API: voice feature extraction and Parkinson's research-demo classifier."
requires-python = ">=3.11"
# Packages are added in the milestone that first uses them.
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    # Audio feature extraction (M3)
    "numpy>=2.0,<3.0",
    "praat-parselmouth>=0.4.3,<0.5",
    "librosa>=0.10,<0.12",
    # Prediction API (M4)
    "pandas>=2.2,<4.0",
    # Pinned exactly: the saved model must load with the version that trained it.
    "scikit-learn==1.9.1",
    "shap>=0.46,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "black>=24.0",
    "pre-commit>=3.7",
]

[tool.setuptools.packages.find]
include = ["app*"]
