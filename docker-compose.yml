# Local development stack: FastAPI backend + Vite frontend.
# Usage: cp .env.example .env && docker compose up --build
# No database: the model artifact is a file and audio is never stored.

services:
  backend:
    build: ./backend
    env_file:
      - path: .env
        required: false
    # Same image as production; for development, reload on code changes.
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      PORT: "8000"
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
      - ./backend/models:/app/models

  frontend:
    build: ./frontend
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      # Anonymous volume: keep the container's node_modules, not the host's.
      - /app/node_modules
    depends_on:
      backend:
        condition: service_healthy
